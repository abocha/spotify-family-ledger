[project]
name = "spotify-family-ledger"
version = "1.1.1"
description = "Small owner-facing web app for managing a shared Spotify Family subscription."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "sqlalchemy>=2.0.49",
    "sqlalchemy-libsql>=0.1.0",
    "streamlit>=1.36.0",
    "ty>=0.0.29",
    "xlsxwriter>=3.2.6",
    "python-dateutil>=2.9.0",
    "bcrypt>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."

[dependency-groups]
dev = ["openpyxl>=3.1.5"]
